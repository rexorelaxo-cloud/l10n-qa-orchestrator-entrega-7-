[pytest]
pythonpath = .
testpaths = tests
addopts = -q -m "not openai_real"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    openai_real: pruebas con llamadas REALES a OpenAI (requieren OPENAI_API_KEY y OPENAI_MODEL; consumen tokens)
    redis: pruebas que usan un servidor Redis real (se levanta uno efímero con redis-server o se usa REDIS_TEST_URL)
