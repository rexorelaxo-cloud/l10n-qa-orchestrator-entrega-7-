# L10n QA Orchestrator: Redis + API (FastAPI) + worker (LangGraph).
# Uso:  cp .env.example .env   (completar lo necesario)   →   docker compose up --build
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_PRICE_INPUT_PER_1M: ${OPENAI_PRICE_INPUT_PER_1M:-}
  OPENAI_PRICE_OUTPUT_PER_1M: ${OPENAI_PRICE_OUTPUT_PER_1M:-}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-l10n-qa-orchestrator}
  APPROVAL_TOKEN: ${APPROVAL_TOKEN:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
  LEASE_SECONDS: ${LEASE_SECONDS:-120}
  INPUT_ROOT: /app/fixtures
  OUTPUT_DIR: /app/salida

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]      # persistencia AOF: sobrevive a reinicios
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures:/app/fixtures:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    volumes:
      - ./fixtures:/app/fixtures:ro
      - ./salida:/app/salida
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
